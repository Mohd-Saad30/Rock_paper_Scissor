<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1> Rock Paper Scissor</h1>
    <div id="colorMode">
        <button id="mode" style="background-color: aliceblue;">Dark Mode</button>
    </div>
    <div class="choices">
        <div class="choice" id="Rock">
            <img src="./images/images.png" alt="Rock">
         </div>
       
        <div class="choice" id="Paper">
            <img src="./images/images (1).jfif" alt="Paper">
        </div>
        <div class="choice" id="Scissor">
            <img src="./images/67ebfd32e898b4ec3ae4e59ae33832c8.jpg" alt="Scissor">
        </div>
    </div>
     
        <div class="scoreBoard">
            <h3 id="Score">Score</h5>
            <div class="score">
                <p id="user">0</p>
                <p>You</p>
            </div>
            <div class="score">
                <p id="comp">0</p>
                <p>Comp</p>
            </div>
        </div>
        <div class="msg-container">
            <p id="msg">Play Your move</p>
            <br>
            
        </div>
        <div id="btn">
            <Button id="restart" style="display: none;">Restart</Button>
        </div>
        
        <script src="index.js"></script>
   
</body>
</html>
